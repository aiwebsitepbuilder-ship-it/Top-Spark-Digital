<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Top Spark Digital</title>
    <script>
      // Single Page App redirect helper for GitHub Pages
      // Redirects nested paths (e.g. /services, /case-studies) back to index.html with the route encoded
      var pathSegmentsToKeep = 1;
      var l = window.location;
      // If deployed on custom domain (topsparkdigital.com), pathSegmentsToKeep is 0
      if (!l.hostname.endsWith('github.io')) {
        pathSegmentsToKeep = 0;
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#090A0F; color:#F8FAFC; font-family:sans-serif; text-align:center; padding-top:100px;">
    <p>Loading Top Spark Digital...</p>
  </body>
</html>
